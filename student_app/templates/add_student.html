{% extends "base.html" %}
{% block content %}
<h2>Add Student</h2>
    <form method="POST">
        {% csrf_token %}">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label for="marks">Marks</label>
            <input type="number" name="marks" required>
        </div>
        <button type="submit">save</button>
    </form>
{% endblock %}
