{% extends "base.html" %}
{% block content %}
    <div class="container">
        <h2>Logout</h2>
        <p>Are you sure you want to logout?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit">Logout</button>
            <a href="{% url 'welcome' %}">Cancel</a>
        </form>
    </div>
{% endblock %}
